<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background for Android adaptive icons -->
  <rect width="512" height="512" fill="#0F2A3A"/>

  <!-- Content scaled to 78% safe zone -->
  <g transform="translate(56 56) scale(0.78)">
    <!-- Ground -->
    <rect x="0" y="310" width="512" height="202" fill="#1A3828"/>
    <!-- Ground surface -->
    <rect x="0" y="298" width="512" height="18" fill="#2E5E3C"/>

    <!-- Probe shaft -->
    <rect x="232" y="148" width="48" height="162" rx="10" fill="#F5F1E8"/>

    <!-- Probe tip -->
    <polygon points="256,380 235,316 277,316" fill="#F5F1E8"/>

    <!-- Sensor head -->
    <circle cx="256" cy="128" r="92" fill="#E07A5F"/>

    <!-- Reading lines -->
    <rect x="220" y="98" width="72" height="10" rx="5" fill="#F5F1E8"/>
    <rect x="226" y="118" width="60" height="8" rx="4" fill="#F5F1E8" opacity="0.75"/>
    <rect x="232" y="136" width="48" height="7" rx="3" fill="#F5F1E8" opacity="0.5"/>
  </g>
</svg>
