  <!-- Analyzer box -->
  <rect x="416" y="274" width="62" height="48" rx="5"
        fill="#1B3D52" stroke="#F5F1E8" stroke-width="2.5"/>
  <circle cx="432" cy="287" r="4.5" fill="#E07A5F"/>
  <rect x="430" y="300" width="40" height="7" fill="#F5F1E8" opacity="0.6"/>
