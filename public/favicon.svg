  <circle cx="174" cy="194" r="11" fill="#E07A5F"/>
  <circle cx="230" cy="180" r="8"  fill="#E07A5F"/>
  <circle cx="206" cy="232" r="13" fill="#E07A5F"/>
  <circle cx="248" cy="218" r="7"  fill="#E07A5F"/>
  <circle cx="184" cy="260" r="9"  fill="#E07A5F"/>
  <circle cx="240" cy="270" r="11" fill="#E07A5F"/>
  <circle cx="206" cy="290" r="6"  fill="#E07A5F"/>

  <!-- Upward flux arrows -->
  <g fill="#E07A5F" opacity="0.75">
    <polygon points="172,310 178,296 184,310 181,306 181,316 175,316 175,306"/>
    <polygon points="202,310 208,296 214,310 211,306 211,316 205,316 205,306"/>
    <polygon points="232,310 238,296 244,310 241,306 241,316 235,316 235,306"/>
    <polygon points="262,310 268,296 274,310 271,306 271,316 265,316 265,306"/>
