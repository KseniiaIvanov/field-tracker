    <path d="M 140 350 C 134 318, 162 296, 200 296 C 230 294, 252 304, 280 300 C 312 296, 340 308, 350 332 C 360 354, 350 380, 322 392 C 290 406, 254 408, 226 404 C 200 402, 178 396, 162 388 C 150 380, 140 366, 140 350 Z"/>
