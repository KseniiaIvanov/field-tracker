  <circle cx="92"  cy="470" r="7" fill="#F5F1E8" opacity="0.8"/>
  <circle cx="430" cy="430" r="7" fill="#F5F1E8" opacity="0.8"/>
  <circle cx="470" cy="370" r="7" fill="#F5F1E8" opacity="0.8"/>
  <circle cx="200" cy="490" r="6" fill="#F5F1E8" opacity="0.7"/>
