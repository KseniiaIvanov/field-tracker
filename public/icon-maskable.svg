<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Full-bleed background for Android adaptive icons -->
  <rect width="512" height="512" fill="#0F2A3A"/>

  <!-- Content scaled to 78% safe zone -->
  <g transform="translate(56 56) scale(0.78)">
    <!-- Outermost topo band -->
    <ellipse cx="256" cy="340" rx="230" ry="110" fill="#1B3D52"/>
    <!-- Middle topo band -->
    <ellipse cx="248" cy="316" rx="168" ry="80" fill="#2C6068"/>
    <!-- Inner topo band (summit) -->
    <ellipse cx="244" cy="296" rx="104" ry="52" fill="#3D8070"/>
    <!-- Sample point marker -->
    <circle cx="244" cy="180" r="54" fill="#F5F1E8"/>
    <circle cx="244" cy="180" r="34" fill="#E07A5F"/>
    <!-- Probe line -->
    <rect x="236" y="230" width="16" height="70" rx="6" fill="#F5F1E8"/>
  </g>
</svg>
