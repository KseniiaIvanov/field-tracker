<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="92" fill="#0F2A3A"/>

  <!-- Outermost topo band -->
  <ellipse cx="256" cy="340" rx="230" ry="110" fill="#1B3D52"/>

  <!-- Middle topo band -->
  <ellipse cx="248" cy="316" rx="168" ry="80" fill="#2C6068"/>

  <!-- Inner topo band (summit) -->
